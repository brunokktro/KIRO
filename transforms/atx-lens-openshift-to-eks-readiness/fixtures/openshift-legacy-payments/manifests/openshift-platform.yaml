---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: payments-anyuid
allowPrivilegedContainer: false
allowHostNetwork: false
allowHostPID: false
allowHostIPC: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:payments-prod:payments-api
---
apiVersion: quota.openshift.io/v1
kind: ClusterResourceQuota
metadata:
  name: payments-tenant
spec:
  selector:
    labels:
      matchLabels:
        tenant: payments
  quota:
    hard:
      requests.cpu: "64"
      requests.memory: 128Gi
      limits.cpu: "128"
      persistentvolumeclaims: "40"
      pods: "200"
---
apiVersion: k8s.ovn.org/v1
kind: EgressIP
metadata:
  name: payments-egress
spec:
  egressIPs:
    - 10.40.12.220
  namespaceSelector:
    matchLabels:
      tenant: payments
---
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: payments-prod
spec:
  egress:
    - type: Allow
      to:
        dnsName: acquirer.partner.example.com
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
---
apiVersion: performance.openshift.io/v2
kind: PerformanceProfile
metadata:
  name: payments-lowlatency
spec:
  cpu:
    isolated: "4-31"
    reserved: "0-3"
  hugepages:
    defaultHugepagesSize: 2M
    pages:
      - count: 2048
        size: 2M
  realTimeKernel:
    enabled: false
  numa:
    topologyPolicy: single-numa-node
  nodeSelector:
    node-role.kubernetes.io/worker-lowlatency: ""
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-payments-sysctl
  labels:
    machineconfiguration.openshift.io/role: worker-lowlatency
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/sysctl.d/99-payments.conf
          mode: 420
          contents:
            source: data:,net.core.somaxconn%3D32768%0Anet.ipv4.tcp_tw_reuse%3D1%0A
