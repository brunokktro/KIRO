---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetworkNodePolicy
metadata:
  name: payments-hsm-nic
  namespace: openshift-sriov-network-operator
spec:
  resourceName: hsm_nic
  nodeSelector:
    feature.node.kubernetes.io/network-sriov.capable: "true"
  numVfs: 8
  nicSelector:
    vendor: "8086"
    deviceID: "158b"
  deviceType: vfio-pci
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: payments-hsm-net
  namespace: openshift-sriov-network-operator
spec:
  resourceName: hsm_nic
  networkNamespace: payments-prod
  vlan: 412
  ipam: |
    { "type": "static" }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: payments-hsm-net
  namespace: payments-prod
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": 412,
      "ipam": { "type": "static", "addresses": [{ "address": "10.90.4.11/24" }] }
    }
---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: payments-hsm-bridge
  namespace: payments-prod
  annotations:
    k8s.v1.cni.cncf.io/networks: payments-hsm-net
spec:
  replicas: 2
  selector:
    app: payments-hsm-bridge
  template:
    metadata:
      labels:
        app: payments-hsm-bridge
      annotations:
        k8s.v1.cni.cncf.io/networks: payments-hsm-net
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: payments-hsm
      containers:
        - name: bridge
          image: payments-hsm-bridge:latest
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN", "IPC_LOCK"]
          resources:
            limits:
              openshift.io/hsm_nic: "1"
          volumeMounts:
            - name: dev
              mountPath: /dev
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
