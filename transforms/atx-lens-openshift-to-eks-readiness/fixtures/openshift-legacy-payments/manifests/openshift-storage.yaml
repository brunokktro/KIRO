---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payments-spool
  namespace: payments-prod
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ocs-storagecluster-cephfs
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payments-ledger
  namespace: payments-prod
spec:
  serviceName: payments-ledger
  replicas: 3
  selector:
    matchLabels:
      app: payments-ledger
  template:
    metadata:
      labels:
        app: payments-ledger
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: payments-ledger
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ledger
          image: payments-ledger:latest
          volumeMounts:
            - name: data
              mountPath: /var/lib/ledger
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: thin
        resources:
          requests:
            storage: 100Gi
---
apiVersion: imageregistry.operator.openshift.io/v1
kind: Config
metadata:
  name: cluster
spec:
  managementState: Managed
  storage:
    pvc:
      claim: image-registry-storage
  replicas: 2
