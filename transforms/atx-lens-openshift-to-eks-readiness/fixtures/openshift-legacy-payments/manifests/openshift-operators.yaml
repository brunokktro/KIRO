#
# Deliberately seeded with all THREE buckets the rubric requires to be reported separately.
# A run that emits a single collapsed "you use operators" finding has failed OPS-Q3.
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: payments-operators
  namespace: payments-prod
spec:
  targetNamespaces:
    - payments-prod
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: strimzi-kafka-operator
  namespace: payments-prod
spec:
  channel: stable
  name: strimzi-kafka-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: payments-prod
spec:
  channel: stable-v26
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-pipelines-operator-rh
  namespace: openshift-operators
spec:
  channel: latest
  name: openshift-pipelines-operator-rh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: payments-internal-catalog
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: registry.example.internal/olm/payments-catalog:v3
  displayName: Payments Internal Operators
---
# A CR of an operator-provided CRD: proves the app DEPENDS on the operator, not just
# that the operator is installed.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: payments-settlement
  namespace: payments-prod
  labels:
    strimzi.io/cluster: payments-kafka
spec:
  partitions: 24
  replicas: 3
