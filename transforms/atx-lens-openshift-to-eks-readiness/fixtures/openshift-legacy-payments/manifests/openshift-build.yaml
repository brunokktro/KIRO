---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: payments-api
  namespace: payments-prod
spec:
  source:
    type: Git
    git:
      uri: https://git.example.internal/payments/payments-api.git
      ref: main
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: java:openjdk-21-ubi9
      incremental: true
      env:
        - name: MAVEN_ARGS
          value: "-DskipTests package"
  output:
    to:
      kind: ImageStreamTag
      name: payments-api:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
    - type: GitHub
      github:
        secretReference:
          name: payments-webhook
---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: payments-worker
  namespace: payments-prod
parameters:
  - name: WORKER_REPLICAS
    value: "2"
    required: true
  - name: QUEUE_PASSWORD
    generate: expression
    from: "[a-zA-Z0-9]{24}"
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: payments-worker
    spec:
      replicas: "${{WORKER_REPLICAS}}"
      selector:
        matchLabels:
          app: payments-worker
      template:
        metadata:
          labels:
            app: payments-worker
        spec:
          containers:
            - name: worker
              image: payments-worker:latest
              env:
                - name: QUEUE_PASSWORD
                  value: ${QUEUE_PASSWORD}
