#
# These MUST NOT produce any finding. They exist to prove zero false positives, the same way
# the ACK and EKS fixtures use control resources that must come out byte-identical.
#
# If a run flags anything in this file, that is a false positive and a hard fail - regardless
# of how correct the rest of the run is.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-notifier
  namespace: payments-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-notifier
  template:
    metadata:
      labels:
        app: payments-notifier
    spec:
      serviceAccountName: payments-notifier
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifier
          image: public.ecr.aws/example/payments-notifier:1.14.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-notifier
  namespace: payments-prod
spec:
  selector:
    app: payments-notifier
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-notifier
  namespace: payments-prod
spec:
  podSelector:
    matchLabels:
      app: payments-notifier
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: payments-api
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-notifier
  namespace: payments-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payments-notifier
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
