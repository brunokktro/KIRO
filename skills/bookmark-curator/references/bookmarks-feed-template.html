<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmark Feed - Bruno Lopes</title>
<style>
  :root {
    --bg: #f5f5f5; --card-bg: #ffffff; --text: #1a1a1a; --text-secondary: #555;
    --accent: #0073BB; --border: #e0e0e0; --tag-bg: #e8f4fd; --tag-text: #0073BB;
    --header-bg: #232F3E; --header-text: #fff; --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --tooltip-bg: #1a1a1a; --tooltip-text: #f0f0f0;
  }
  [data-theme="dark"] {
    --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #aaa;
    --accent: #4fc3f7; --border: #2a2a4a; --tag-bg: #1a3a5c; --tag-text: #4fc3f7;
    --header-bg: #0f0f23; --header-text: #e0e0e0; --shadow: 0 2px 8px rgba(0,0,0,0.3);
    --tooltip-bg: #f0f0f0; --tooltip-text: #1a1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  header { background: var(--header-bg); color: var(--header-text); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.4rem; font-weight: 600; }
  header .meta { font-size: 0.85rem; opacity: 0.8; }
  .theme-toggle { background: none; border: 1px solid var(--header-text); color: var(--header-text); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
  .stats { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.5rem; flex: 1; min-width: 140px; box-shadow: var(--shadow); }
  .stat-card .number { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .stat-card .label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card.clickable { cursor: pointer; transition: transform 0.15s, border-color 0.2s; }
  .stat-card.clickable:hover { transform: translateY(-2px); border-color: var(--accent); }
  .stat-card.clickable.active { border-color: var(--accent); border-width: 2px; }
  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; padding: 1rem; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); }
  .filter-btn { padding: 0.4rem 0.9rem; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.82rem; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #feed { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); transition: transform 0.15s, box-shadow 0.15s; display: flex; overflow: hidden; cursor: default; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  .card-icon { width: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); border-right: 1px solid var(--border); }
  .card-icon img { width: 32px; height: 32px; border-radius: 6px; }
  .card-body { padding: 1rem 1.2rem; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.8rem; }
  .card-title { font-size: 0.95rem; font-weight: 600; color: var(--accent); text-decoration: none; line-height: 1.35; }
  .card-title:hover { text-decoration: underline; }
  .card-domain { font-size: 0.7rem; color: var(--text-secondary); background: var(--bg); padding: 0.15rem 0.5rem; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
  .card-excerpt { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.4rem; margin-top: auto; }
  .tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .tag { font-size: 0.7rem; padding: 0.15rem 0.55rem; border-radius: 12px; background: var(--tag-bg); color: var(--tag-text); font-weight: 500; }
  .card-date { font-size: 0.72rem; color: var(--text-secondary); }
  #tooltip { display: none; position: fixed; background: var(--tooltip-bg); color: var(--tooltip-text); padding: 0.9rem 1.1rem; border-radius: 10px; font-size: 0.85rem; line-height: 1.55; max-width: 380px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); z-index: 9999; pointer-events: none; }
  footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: var(--text-secondary); border-top: 1px solid var(--border); margin-top: 2rem; }
  @media (max-width: 900px) { #feed { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .stats { flex-direction: column; } header { flex-direction: column; gap: 0.8rem; text-align: center; } }
</style>
</head>
<body>
<div id="tooltip"></div>
<header>
  <div>
    <h1>Bookmark Feed</h1>
    <div class="meta">Curated from Firefox "Opened Tabs" | Last updated: {{DATE}}</div>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">Dark/Light</button>
</header>
<div class="container">
  <div class="stats">
    <div class="stat-card"><div class="number">{{TOTAL}}</div><div class="label">Total Links</div></div>
    <div class="stat-card"><div class="number">{{CATEGORIES}}</div><div class="label">Categories</div></div>
    <div class="stat-card clickable" onclick="filterToday()" title="Click to filter"><div class="number">{{NEW_TODAY}}</div><div class="label">New Today</div></div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="filterCards('all')">All</button>
    <!-- {{FILTER_BUTTONS}}: one <button class="filter-btn" onclick="filterCards('tag')">Tag</button> per category -->
  </div>
  <div id="feed">
    <!-- {{CARDS}}: one per bookmark -->
    <!--
    <div class="card" data-tags="tag1,tag2" data-summary="Full summary for tooltip.">
      <div class="card-icon"><img src="https://www.google.com/s2/favicons?domain=DOMAIN&sz=64" alt="DOMAIN"></div>
      <div class="card-body">
        <div class="card-top">
          <a class="card-title" href="URL" target="_blank">Page Title</a>
          <span class="card-domain">domain.com</span>
        </div>
        <div class="card-excerpt">First 2-3 real sentences from the page.</div>
        <div class="card-footer">
          <div class="tags"><span class="tag">tag1</span><span class="tag">tag2</span></div>
          <span class="card-date">YYYY-MM-DD</span>
        </div>
      </div>
    </div>
    -->
  </div>
</div>
<footer>Generated by Bookmark Curator | {{TOTAL}} links | {{CATEGORIES}} categories | {{DATE}}</footer>
<script>
  function toggleTheme(){
    var c=document.documentElement.getAttribute('data-theme');
    var n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  }
  (function(){var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s)})();
  function filterCards(tag){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
    event.target.classList.add('active');
    document.querySelector('.stat-card.clickable').classList.remove('active');
    document.querySelectorAll('.card').forEach(function(c){
      if(tag==='all'){c.style.display='';return}
      c.style.display=(c.getAttribute('data-tags')||'').includes(tag)?'':'none';
    });
  }
  var todayActive=false;
  function filterToday(){
    var btn=document.querySelector('.stat-card.clickable');
    todayActive=!todayActive;
    btn.classList.toggle('active',todayActive);
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
    if(!todayActive){document.querySelector('.filter-btn').classList.add('active')}
    var today=new Date().toISOString().slice(0,10);
    document.querySelectorAll('.card').forEach(function(c){
      if(!todayActive){c.style.display='';return}
      var date=c.querySelector('.card-date');
      c.style.display=(date&&date.textContent.trim()===today)?'':'none';
    });
  }
  var tip=document.getElementById('tooltip');
  document.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('mouseenter',function(e){
      var summary=card.getAttribute('data-summary');
      if(!summary)return;
      tip.textContent=summary;
      tip.style.display='block';
      positionTooltip(e);
    });
    card.addEventListener('mousemove',function(e){positionTooltip(e)});
    card.addEventListener('mouseleave',function(){tip.style.display='none'});
  });
  function positionTooltip(e){
    var x=e.clientX+16;var y=e.clientY-10;
    var tw=tip.offsetWidth;var th=tip.offsetHeight;
    if(x+tw>window.innerWidth-20)x=e.clientX-tw-16;
    if(y+th>window.innerHeight-20)y=e.clientY-th-10;
    if(y<10)y=10;
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
</script>
</body>
</html>
